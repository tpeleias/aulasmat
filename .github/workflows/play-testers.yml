name: Play closed-test testers

# Liga um Google Grupo ao teste fechado (trilha alpha) da Play: quem estiver
# no grupo pode entrar no teste pelo link de participação. A API da Play só
# aceita grupos aqui; lista de e-mails avulsos se edita no Play Console.
# Os grupos informados SUBSTITUEM os que já estavam ligados à trilha.
on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Google Grupos, separados por vírgula (ex.: testadores-cronys@googlegroups.com)'
        required: true
      track:
        description: 'Trilha'
        default: 'alpha'
        required: true

jobs:
  testers:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-auth
        run: pip install --quiet google-auth requests

      - name: Set testers
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GROUPS: ${{ inputs.groups }}
          TRACK: ${{ inputs.track }}
        run: |
          python - <<'PY'
          import json, os, sys
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          groups = [g.strip() for g in os.environ["GROUPS"].split(",") if g.strip()]
          if not groups or any("@" not in g for g in groups):
              sys.exit(f"ERRO: grupos inválidos: {groups}")
          track = os.environ["TRACK"]
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["PLAY_JSON"]), scopes=["https://www.googleapis.com/auth/androidpublisher"])
          creds.refresh(Request())
          h = {"Authorization": f"Bearer {creds.token}"}
          base = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.aulasmat.app"
          r = requests.post(f"{base}/edits", headers=h)
          if r.status_code != 200:
              sys.exit(f"ERRO ao abrir edição ({r.status_code}): {r.text}")
          edit = r.json()["id"]
          ok = False
          try:
              before = requests.get(f"{base}/edits/{edit}/testers/{track}", headers=h)
              print("Antes:", before.status_code, before.text)
              r = requests.put(f"{base}/edits/{edit}/testers/{track}", headers=h, json={"googleGroups": groups})
              if r.status_code != 200:
                  sys.exit(f"ERRO ao gravar testadores ({r.status_code}): {r.text}")
              print("Depois:", r.text)
              c = requests.post(f"{base}/edits/{edit}:commit", headers=h)
              if c.status_code != 200:
                  sys.exit(f"ERRO ao confirmar ({c.status_code}): {c.text}")
              ok = True
              print(f"OK: {', '.join(groups)} ligado(s) à trilha {track}.")
          finally:
              if not ok:
                  requests.delete(f"{base}/edits/{edit}", headers=h)
          PY
