name: Build Android release (Play)

# Manual only: a store upload is a deliberate act, not something every push should do.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nome da versão mostrado na Play (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      track:
        description: 'Para onde enviar na Play (none = só gera o aab, sem enviar)'
        required: true
        # internal: só o teste interno (o Thiago vê na hora, sem revisão). O
        # teste fechado (alpha) recebe versão só quando o Thiago pedir, com
        # internal+alpha ou alpha. Produção só quando ele abrir para o público.
        default: internal
        type: choice
        options: [internal, internal+alpha, alpha, beta, production, none]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          # Hides the in-app updater: a store build updates through the store.
          APP_DISTRIBUTION: play

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google discontinued the legacy "tools" package; the action's default package
          # list still requests it and fails the whole job. Gradle fetches whatever
          # platform/build-tools it needs on its own, so platform-tools is all this step
          # has to install.
          packages: platform-tools

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64. Veja docs/publicar-na-play.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build signed app bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Always higher than the previous upload, which is all the store checks.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew bundleRelease

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      # Private to the repository, unlike the debug APK: this artifact is signed with the
      # upload key and belongs in the Play Console, not on a public download page.
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: aulas-play-${{ inputs.version_name }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Envio direto para a Play (docs/publicar-na-play.md, "Envio automático").
      # Sem o segredo PLAY_SERVICE_ACCOUNT_JSON, ou com track = none, o aab fica
      # só como artefato acima, como antes.
      - name: Check Play upload credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.track }}" = "none" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PLAY_JSON" ]; then
            echo "::warning::Sem o segredo PLAY_SERVICE_ACCOUNT_JSON: o aab não foi enviado para a Play. Baixe o artefato ou configure o envio automático (docs/publicar-na-play.md)."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      # As notas da versão ("O que há de novo") saem de android/whatsnew/whatsnew-pt-BR,
      # que é atualizado junto com cada versão.
      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aulasmat.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ inputs.version_name }}
          # Em "internal+alpha" o aab sobe uma vez só, no interno; o passo
          # seguinte põe a mesma versão no teste fechado.
          track: ${{ inputs.track == 'internal+alpha' && 'internal' || inputs.track }}
          # completed = vai para a revisão da Google e, aprovado, publica sozinho.
          status: completed
          whatsNewDirectory: android/whatsnew

      # O mesmo aab (mesmo código de versão) também vai para o teste fechado.
      # Enviar o arquivo de novo daria erro de "versão já usada".
      - name: Also release to closed testing (alpha)
        if: steps.play.outputs.upload == 'true' && inputs.track == 'internal+alpha'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          pip install --quiet google-auth requests
          python - <<'PY'
          import json, os, sys
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["PLAY_JSON"]), scopes=["https://www.googleapis.com/auth/androidpublisher"])
          creds.refresh(Request())
          h = {"Authorization": f"Bearer {creds.token}"}
          base = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.aulasmat.app"

          def ok(r, what):
              if r.status_code >= 300:
                  sys.exit(f"ERRO em {what} ({r.status_code}): {r.text}")
              return r.json() if r.text else {}

          notes = open("android/whatsnew/whatsnew-pt-BR", encoding="utf-8").read().strip()
          edit = ok(requests.post(f"{base}/edits", headers=h), "abrir edição")["id"]
          body = {"track": "alpha", "releases": [{
              "name": os.environ["VERSION_NAME"],
              "versionCodes": [os.environ["VERSION_CODE"]],
              "status": "completed",
              "releaseNotes": [{"language": "pt-BR", "text": notes}],
          }]}
          ok(requests.put(f"{base}/edits/{edit}/tracks/alpha", headers=h, json=body), "teste fechado")
          ok(requests.post(f"{base}/edits/{edit}:commit", headers=h), "salvar")
          print(f"OK: versão {os.environ['VERSION_NAME']} ({os.environ['VERSION_CODE']}) também no teste fechado.")
          PY
