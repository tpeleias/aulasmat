name: Update Google Play listing

# Atualiza a ficha da loja a partir do repositório:
#   store/listing/title.txt, short-description.txt, full-description.txt
#   store/pt-BR/phoneScreenshots/*.png (em ordem de nome) e featureGraphic.png
# Com apply = false só mostra o que está na loja hoje (nada muda).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Publicar (false = só listar o que está lá)'
        required: true
        default: false
        type: boolean
      languages:
        description: 'Idiomas da ficha a atualizar (separados por vírgula)'
        required: true
        default: 'pt-BR,pt-PT'
      default_language:
        description: 'Idioma padrão da ficha (vazio = não muda)'
        required: false
        default: 'pt-BR'

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests
      - name: Update listing
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APPLY: ${{ inputs.apply }}
          LANGS: ${{ inputs.languages }}
          DEFAULT_LANG: ${{ inputs.default_language }}
        run: |
          python - <<'PY'
          import glob, json, os, sys
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ["PLAY_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/androidpublisher"])
          creds.refresh(Request())
          h = {"Authorization": f"Bearer {creds.token}"}
          pkg = "com.aulasmat.app"
          apply = os.environ["APPLY"] == "true"
          langs = [x.strip() for x in os.environ["LANGS"].split(",") if x.strip()]
          default_lang = os.environ.get("DEFAULT_LANG", "").strip()
          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}"
          up = f"https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/{pkg}"

          def ok(r, what):
              if r.status_code >= 300:
                  sys.exit(f"ERRO em {what} ({r.status_code}): {r.text}")
              return r.json() if r.text else {}

          def read(path):
              return open(path, encoding="utf-8").read().strip() if os.path.exists(path) else None

          edit = ok(requests.post(f"{base}/edits", headers=h), "abrir edição")["id"]
          committed = False
          try:
              details = ok(requests.get(f"{base}/edits/{edit}/details", headers=h), "ler detalhes")
              listings = {x["language"]: x for x in ok(requests.get(f"{base}/edits/{edit}/listings", headers=h), "listar fichas").get("listings", [])}
              print("Idioma padrão:", details.get("defaultLanguage"), "| fichas:", list(listings))
              for lang, l in listings.items():
                  for kind in ["phoneScreenshots", "featureGraphic"]:
                      imgs = ok(requests.get(f"{base}/edits/{edit}/listings/{lang}/{kind}", headers=h), f"listar {kind}").get("images", [])
                      print(f"[{lang}] {kind}: {len(imgs)}")
                      for i in imgs:
                          print("   ", i.get("url"))
              if not apply:
                  print("Só listagem (apply = false). Nada foi mudado.")
                  sys.exit(0)

              current = listings.get(details.get("defaultLanguage")) or next(iter(listings.values()), {})
              title = read("store/listing/title.txt") or current.get("title")
              short = read("store/listing/short-description.txt") or current.get("shortDescription")
              full = read("store/listing/full-description.txt") or current.get("fullDescription")
              shots = sorted(glob.glob("store/pt-BR/phoneScreenshots/*.png"))
              fg = "store/pt-BR/featureGraphic.png"

              for lang in langs:
                  body = {"language": lang, "title": title, "shortDescription": short, "fullDescription": full}
                  if listings.get(lang, {}).get("video"):
                      body["video"] = listings[lang]["video"]
                  ok(requests.put(f"{base}/edits/{edit}/listings/{lang}", headers=h, json=body), f"texto {lang}")
                  print(f"[{lang}] texto atualizado")
                  if shots:
                      ok(requests.delete(f"{base}/edits/{edit}/listings/{lang}/phoneScreenshots", headers=h), f"apagar capturas {lang}")
                      for f in shots:
                          with open(f, "rb") as fh:
                              ok(requests.post(f"{up}/edits/{edit}/listings/{lang}/phoneScreenshots?uploadType=media",
                                               headers={**h, "Content-Type": "image/png"}, data=fh.read()), f"enviar {f}")
                      print(f"[{lang}] {len(shots)} capturas enviadas")
                  if os.path.exists(fg):
                      ok(requests.delete(f"{base}/edits/{edit}/listings/{lang}/featureGraphic", headers=h), f"apagar destaque {lang}")
                      with open(fg, "rb") as fh:
                          ok(requests.post(f"{up}/edits/{edit}/listings/{lang}/featureGraphic?uploadType=media",
                                           headers={**h, "Content-Type": "image/png"}, data=fh.read()), f"enviar destaque {lang}")
                      print(f"[{lang}] destaque enviado")
                  # O ícone é o mesmo em todos os idiomas: copia o atual se a ficha for nova.
                  if lang not in listings:
                      src = details.get("defaultLanguage")
                      icons = ok(requests.get(f"{base}/edits/{edit}/listings/{src}/icon", headers=h), "ler ícone").get("images", [])
                      if icons:
                          png = requests.get(icons[0]["url"] + "=s512").content
                          ok(requests.post(f"{up}/edits/{edit}/listings/{lang}/icon?uploadType=media",
                                           headers={**h, "Content-Type": "image/png"}, data=png), f"ícone {lang}")
                          print(f"[{lang}] ícone copiado")

              if default_lang and default_lang != details.get("defaultLanguage"):
                  ok(requests.patch(f"{base}/edits/{edit}/details", headers=h, json={"defaultLanguage": default_lang}), "idioma padrão")
                  print("Idioma padrão agora:", default_lang)

              ok(requests.post(f"{base}/edits/{edit}:commit", headers=h), "salvar na loja")
              committed = True
              print("OK: ficha da loja atualizada.")
          finally:
              if not committed:
                  requests.delete(f"{base}/edits/{edit}", headers=h)
          PY
